<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>viiwork node</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; background: #0d1117; color: #c9d1d9; padding: 24px; }
  h1 { font-size: 1.4rem; margin-bottom: 16px; color: #58a6ff; }
  h2 { font-size: 1.1rem; margin: 20px 0 10px; color: #8b949e; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; margin-bottom: 12px; }
  .status { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
  .healthy, .reachable { background: #3fb950; }
  .unhealthy { background: #d29922; }
  .dead, .unreachable { background: #f85149; }
  .starting { background: #8b949e; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: 500; font-size: 0.85rem; }
  .models { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .model-tag { background: #1f6feb22; border: 1px solid #1f6feb; border-radius: 4px; padding: 2px 8px; font-size: 0.85rem; color: #58a6ff; }
  .summary { display: flex; gap: 24px; margin-bottom: 16px; font-size: 0.9rem; flex-wrap: wrap; }
  .summary span { color: #8b949e; }
  .summary strong { color: #c9d1d9; }
  #error { color: #f85149; display: none; margin-bottom: 12px; }
  canvas { width: 100%; margin-bottom: 8px; border: 1px solid #21262d; border-radius: 4px; }
  #footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid #21262d; color: #484f58; font-size: 0.75rem; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 20px; align-items: start; }
  .two-col > div > h2 { margin-top: 0; }
  .left-col { display: flex; flex-direction: column; }
  .left-col #activity-log { flex: 1; overflow-y: auto; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1 id="title">viiwork</h1>
<div id="topology" style="color:#8b949e;font-size:0.85rem;margin:-8px 0 16px"></div>
<div id="error"></div>
<div id="summary" class="summary"></div>
<div id="fleet-section"></div>
<div class="two-col">
  <div class="left-col" id="activity-section">
    <div id="cluster-models"></div>
    <div id="inflight-section" style="display:none;margin-bottom:12px">
      <h2>In-Flight Requests</h2>
      <div id="inflight-list" class="card" style="font-size:0.8rem;font-family:monospace;padding:8px 12px"></div>
    </div>
    <h2>Activity</h2>
    <div id="activity-log" class="card" style="overflow-y:auto;font-size:0.8rem;font-family:monospace;padding:8px 12px"></div>
  </div>
  <div>
    <div id="backends-section"></div>
    <div id="hostmem-section" style="display:none;margin-bottom:12px">
      <div style="position:relative">
        <canvas id="graph-hostmem" height="120"></canvas>
        <span id="hostmem-live" style="position:absolute;top:4px;right:8px;font-size:0.8rem;font-family:monospace;color:#bc8cff"></span>
      </div>
    </div>
    <div id="graphs-section" style="display:none">
      <h2>GPU Metrics (1h)</h2>
      <canvas id="graph-util" height="160"></canvas>
      <canvas id="graph-vram" height="160"></canvas>
      <canvas id="graph-power" height="120"></canvas>
    </div>
    <div id="graphs-unavailable" style="display:none;color:#8b949e;text-align:center;padding:40px">GPU metrics unavailable</div>
  </div>
</div>
<div id="footer"></div>

<script>
// --- This node (/v1/status) and the fleet line (/v1/cluster) ---
//
// The node's own section reads /v1/status; /v1/cluster is used only for the
// fleet line. Both are polled on v1's one-second schedule.

async function refresh() {
  try {
    const [statusResp, clusterResp] = await Promise.all([fetch('/v1/status'), fetch('/v1/cluster')]);
    if (!statusResp.ok) throw new Error('HTTP ' + statusResp.status);
    const status = await statusResp.json();
    const cluster = clusterResp.ok ? await clusterResp.json() : null;
    document.getElementById('error').style.display = 'none';
    render(status, cluster);
  } catch (e) {
    document.getElementById('error').textContent = 'Failed to fetch node status: ' + e.message;
    document.getElementById('error').style.display = 'block';
  }
}

function gpuColor(id) {
  return GPU_COLORS[((id % GPU_COLORS.length) + GPU_COLORS.length) % GPU_COLORS.length];
}

function gpuLabelHtml(ids) {
  if (!ids || !ids.length) return '<span style="color:#8b949e">cpu</span>';
  return ids.map(id => `<span style="color:${gpuColor(id)}">gpu-${id}</span>`).join(' + ');
}

function fmtMB(mb) { return mb >= 1024 ? (mb / 1024).toFixed(1) + 'G' : mb + 'M'; }

// rssCell renders RSS with a trend arrow from the last few minutes of samples.
function rssCell(key, rssMB) {
  if (!rssMB) return '<td></td>';
  if (!backendRSSHistory[key]) backendRSSHistory[key] = [];
  backendRSSHistory[key].push({t: Math.floor(Date.now()/1000), rss: rssMB});
  if (backendRSSHistory[key].length > RSS_HISTORY_MAX)
    backendRSSHistory[key] = backendRSSHistory[key].slice(-RSS_HISTORY_MAX);
  const history = backendRSSHistory[key];
  let trend = '→', trendColor = '#8b949e';
  if (history.length >= 10) {
    const half = Math.floor(history.length / 2);
    const earlyAvg = history.slice(0, half).reduce((s, h) => s + h.rss, 0) / half;
    const lateAvg = history.slice(-half).reduce((s, h) => s + h.rss, 0) / half;
    const pct = ((lateAvg - earlyAvg) / earlyAvg) * 100;
    if (pct > 2) { trend = '↑'; trendColor = pct > 10 ? '#f85149' : '#d29922'; }
    else if (pct < -2) { trend = '↓'; trendColor = '#3fb950'; }
  }
  return `<td><span style="color:${trendColor};font-weight:bold">${trend}</span> ${fmtMB(rssMB)}</td>`;
}

// utilCell and vramCell read the live GPU metrics, aggregated across a
// tensor-split backend's cards: utilisation per card, VRAM summed.
function utilCell(ids) {
  const parts = [];
  let maxUtil = null;
  for (const id of (ids || [])) {
    const samples = metricsData[String(id)];
    if (samples && samples.length > 0) {
      const u = Math.round(samples[samples.length - 1].util);
      parts.push(u);
      if (maxUtil === null || u > maxUtil) maxUtil = u;
    }
  }
  if (maxUtil === null) return '<td></td>';
  let color = '#8b949e';
  if (maxUtil > 80) color = '#f85149';
  else if (maxUtil > 40) color = '#d29922';
  else if (maxUtil > 0) color = '#3fb950';
  return `<td style="color:${color}">${parts.length > 1 ? parts.join('/') : maxUtil}%</td>`;
}

function vramCell(ids) {
  let used = 0, total = 0, have = false;
  for (const id of (ids || [])) {
    const samples = metricsData[String(id)];
    if (samples && samples.length > 0) {
      used += samples[samples.length - 1].vram_used_mb;
      total += (vramTotalMB[String(id)] || 0);
      have = true;
    }
  }
  if (!have) return '<td></td>';
  return `<td>${(used / 1024).toFixed(1)}/${total ? (total / 1024).toFixed(0) : '?'}G</td>`;
}

// tokensCell shows decode progress of the backend's running requests.
function tokensCell(b) {
  const decoded = b.tok_decoded || 0, remain = b.tok_remain || 0;
  if (!(b.busy > 0) || !(decoded + remain > 0)) return '<td style="color:#484f58">idle</td>';
  const total = decoded + remain;
  const pct = Math.round((decoded / total) * 100);
  const barColor = pct > 80 ? '#3fb950' : '#58a6ff';
  return `<td><div style="display:flex;align-items:center;gap:4px;min-width:100px">` +
    `<span style="flex:1;height:8px;background:#21262d;border-radius:2px;overflow:hidden">` +
    `<span style="display:block;width:${pct}%;height:100%;background:${barColor};border-radius:2px"></span></span>` +
    `<span style="color:${barColor};font-size:0.8rem">${decoded}/${total}t</span></div></td>`;
}

function render(status, cluster) {
  const models = status.models || [];
  let backends = 0, healthy = 0;
  for (const m of models) {
    for (const b of (m.backends || [])) {
      backends++;
      if (b.status === 'healthy') healthy++;
    }
  }
  const power = status.power || {};
  const cost = status.cost || {};

  document.getElementById('title').textContent = 'viiwork — ' + status.node;
  document.getElementById('topology').textContent =
    (status.addr ? status.addr + ':' + status.api_port : ':' + status.api_port) +
    (cluster ? ` · ${cluster.mesh} mesh` : '');

  const kwh = status.energy_kwh_24h || 0;
  document.getElementById('summary').innerHTML = `
    <div><span>Node:</span> <strong>${escapeHtml(status.node_id)}</strong></div>
    <div><span>Models:</span> <strong>${models.length}</strong></div>
    <div><span>Backends:</span> <strong>${healthy}/${backends} healthy</strong></div>
    <div><span>GPUs:</span> <strong>${(status.gpus || []).length}</strong></div>
    <div><span>Power:</span> <strong>${power.available ? Math.round(power.watts) + 'W' : 'N/A'}</strong>${power.available && power.source ? ` <span>(${escapeHtml(power.source)})</span>` : ''}</div>
    <div><span>Energy:</span> <strong>${kwh > 0 ? kwh.toFixed(1) + ' kWh (24h)' : 'N/A'}</strong></div>
    <div><span>Cost:</span> <strong>${cost.available ? cost.eur_per_hour.toFixed(2) + ' EUR/h' : 'N/A'}</strong></div>
    <div><span>Today:</span> <strong>${cost.available ? (cost.today_eur || 0).toFixed(2) + ' EUR' : 'N/A'}</strong></div>
  `;

  // The fleet line: every member of the mesh, from /v1/cluster.
  let fleetHtml = '';
  if (cluster) {
    const members = cluster.members || [];
    const alive = members.filter(m => m.state === 'alive');
    let fleetWatts = 0;
    for (const m of alive) {
      const p = m.status && m.status.power;
      if (p && p.available) fleetWatts += p.watts;
    }
    const names = members.map(m => {
      const cls = m.state === 'alive' ? 'healthy' : 'dead';
      return `<span style="margin-right:10px"><span class="status ${cls}"></span>${escapeHtml(m.node)}${m.state === 'alive' ? '' : ' <span style="color:#8b949e">(' + escapeHtml(m.state) + ')</span>'}</span>`;
    }).join('');
    fleetHtml = `<div class="summary">
      <div><span>Fleet:</span> <strong>${alive.length}/${members.length} members alive</strong></div>
      <div><span>Mesh models:</span> <strong>${(cluster.models || []).length}</strong></div>
      <div><span>Fleet power:</span> <strong>${fleetWatts > 0 ? Math.round(fleetWatts) + 'W' : 'N/A'}</strong></div>
      <div><span>Fleet cost:</span> <strong>${cluster.cluster_cost_eur_per_hour ? cluster.cluster_cost_eur_per_hour.toFixed(2) + ' EUR/h' : 'N/A'}</strong></div>
      <div><span>Today:</span> <strong>${cluster.cluster_cost_today_eur ? cluster.cluster_cost_today_eur.toFixed(2) + ' EUR' : 'N/A'}</strong></div>
    </div><div style="margin:-6px 0 16px;font-size:0.85rem">${names}</div>`;
  }
  document.getElementById('fleet-section').innerHTML = fleetHtml;

  // One table per model: engine, busy/slots and queue on the heading, a row
  // per backend beneath.
  let backendsHtml = '';
  if (!models.length) {
    backendsHtml = '<h2>Models</h2><div class="card" style="color:#8b949e">no models configured on this node (it routes to the mesh)</div>';
  }
  for (const m of models) {
    backendsHtml += `<h2>${escapeHtml(m.name)} <span style="font-size:0.85rem;color:#484f58">` +
      `${escapeHtml(m.engine)} · ${m.busy}/${m.slots} busy · ${m.queued || 0} queued` +
      `${m.ctx ? ' · ' + m.ctx + ' ctx/slot' : ''}</span></h2>`;
    backendsHtml += '<div class="card"><table>';
    backendsHtml += '<tr><th></th><th>Backend</th><th>GPUs</th><th>Status</th><th>Busy</th><th>RSS</th><th>GPU%</th><th>VRAM</th><th>Tokens</th><th>Respawns</th></tr>';
    for (const b of (m.backends || [])) {
      backendsHtml += '<tr>';
      backendsHtml += `<td><span class="status ${escapeHtml(b.status)}"></span></td>`;
      backendsHtml += `<td>${escapeHtml(b.id)}</td>`;
      backendsHtml += `<td>${gpuLabelHtml(b.gpus)}</td>`;
      backendsHtml += `<td>${escapeHtml(b.status)}${b.phase ? ' <span style="color:#8b949e">(' + escapeHtml(b.phase) + ')</span>' : ''}</td>`;
      backendsHtml += `<td>${b.busy || 0}/${b.slots || 0}</td>`;
      backendsHtml += rssCell(b.id, b.rss_mb);
      backendsHtml += utilCell(b.gpus);
      backendsHtml += vramCell(b.gpus);
      backendsHtml += tokensCell(b);
      backendsHtml += `<td${b.respawns ? ' style="color:#d29922"' : ''}>${b.respawns || 0}</td>`;
      backendsHtml += '</tr>';
    }
    backendsHtml += '</table></div>';
  }
  document.getElementById('backends-section').innerHTML = backendsHtml;

  // Mesh models → left column top
  let modelsHtml = '<h2>Mesh Models</h2><div class="models" style="margin-bottom:12px">';
  for (const name of ((cluster && cluster.models) || models.map(m => m.name))) {
    modelsHtml += `<span class="model-tag">${escapeHtml(name)}</span>`;
  }
  modelsHtml += '</div>';
  document.getElementById('cluster-models').innerHTML = modelsHtml;

  // Accumulate this machine's power history
  if (power.available) {
    powerHistory.push({t: Math.floor(Date.now()/1000), watts: power.watts});
    if (powerHistory.length > 720) powerHistory = powerHistory.slice(-720);
    drawPowerGraph();
  }

  // Accumulate host memory history
  if (status.host_mem_total_mb > 0) {
    hostMemTotal = status.host_mem_total_mb;
    hostMemHistory.push({t: Math.floor(Date.now()/1000), used: status.host_mem_used_mb});
    if (hostMemHistory.length > 720) hostMemHistory = hostMemHistory.slice(-720);
    document.getElementById('hostmem-section').style.display = '';
    document.getElementById('hostmem-live').textContent = (status.host_mem_used_mb / 1024).toFixed(1) + ' GB';
    drawHostMemGraph();
  }

  document.getElementById('footer').textContent = 'viiwork' + (status.ver ? ' ' + status.ver : '');
}

refresh();
setInterval(refresh, 1000);

// --- GPU Metrics Graphs ---
const GPU_COLORS = [
  '#58a6ff','#3fb950','#d29922','#f85149','#bc8cff',
  '#39d353','#db6d28','#f778ba','#79c0ff','#56d364'
];
let metricsData = {};
let vramTotalMB = {};
let powerHistory = [];
let hostMemHistory = [];
let hostMemTotal = 0;

async function initMetrics() {
  try {
    const resp = await fetch('/v1/metrics');
    const data = await resp.json();
    if (!data.available) {
      document.getElementById('graphs-unavailable').style.display = 'block';
      return;
    }
    document.getElementById('graphs-section').style.display = '';
    metricsData = data.gpus || {};
    for (const [id, samples] of Object.entries(metricsData)) {
      if (samples.length > 0) vramTotalMB[id] = samples[0].vram_total_mb;
    }
    drawAllGraphs();
    startSSE();
  } catch (e) {
    document.getElementById('graphs-unavailable').style.display = 'block';
  }
}

function startSSE() {
  const es = new EventSource('/v1/metrics/stream');
  es.onmessage = (e) => {
    const d = JSON.parse(e.data);
    for (const [id, g] of Object.entries(d.gpus)) {
      if (!metricsData[id]) metricsData[id] = [];
      metricsData[id].push({t: d.t, util: g.util, vram_used_mb: g.vram_used_mb, vram_total_mb: vramTotalMB[id] || 16368});
      if (metricsData[id].length > 720) metricsData[id] = metricsData[id].slice(-720);
    }
    requestAnimationFrame(drawAllGraphs);
  };
}

function drawAllGraphs() {
  drawGraph('graph-util', 'GPU Utilization', 100, '%', s => s.util);
  const maxVRAM = Object.values(vramTotalMB)[0] || 16368;
  drawGraph('graph-vram', 'VRAM Usage', maxVRAM, 'MB', s => s.vram_used_mb);
}

function getGlobalTimeRange() {
  let tMin = Infinity, tMax = -Infinity;
  for (const samples of Object.values(metricsData)) {
    if (samples.length > 0) {
      tMin = Math.min(tMin, samples[0].t);
      tMax = Math.max(tMax, samples[samples.length - 1].t);
    }
  }
  return {tMin: isFinite(tMin) ? tMin : 0, tMax: isFinite(tMax) ? tMax : 1};
}

function drawGraph(canvasId, label, yMax, unit, extractor) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.parentElement.clientWidth || 800;
  const W = canvas.width, H = canvas.height;
  const pad = {l:50, r:10, t:20, b:20};
  const gw = W - pad.l - pad.r, gh = H - pad.t - pad.b;

  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = '#21262d';
  ctx.fillStyle = '#8b949e';
  ctx.font = '11px monospace';
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + gh - (i / 4) * gh;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    ctx.fillText((yMax * i / 4).toFixed(0) + unit, 2, y + 4);
  }
  ctx.fillText(label, pad.l, 14);

  const {tMin, tMax} = getGlobalTimeRange();
  const tRange = Math.max(tMax - tMin, 1);

  let gpuIdx = 0;
  for (const [id, samples] of Object.entries(metricsData)) {
    if (samples.length < 2) { gpuIdx++; continue; }
    ctx.strokeStyle = GPU_COLORS[gpuIdx % GPU_COLORS.length];
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < samples.length; i++) {
      const x = pad.l + ((samples[i].t - tMin) / tRange) * gw;
      const val = extractor(samples[i]);
      const y = pad.t + gh - (val / yMax) * gh;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    gpuIdx++;
  }
}

function drawPowerGraph() {
  const canvas = document.getElementById('graph-power');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.parentElement.clientWidth || 800;
  const W = canvas.width, H = canvas.height;
  const pad = {l:50, r:10, t:20, b:20};
  const gw = W - pad.l - pad.r, gh = H - pad.t - pad.b;

  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  if (powerHistory.length < 2) {
    ctx.fillStyle = '#8b949e';
    ctx.font = '11px monospace';
    ctx.fillText('System Power (accumulating...)', pad.l, 14);
    return;
  }

  const maxW = Math.max(...powerHistory.map(p => p.watts), 100);
  ctx.strokeStyle = '#21262d';
  ctx.fillStyle = '#8b949e';
  ctx.font = '11px monospace';
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + gh - (i / 4) * gh;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    ctx.fillText((maxW * i / 4).toFixed(0) + 'W', 2, y + 4);
  }
  ctx.fillText('System Power', pad.l, 14);

  ctx.strokeStyle = '#f0883e';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const tMin = powerHistory[0].t, tMax = powerHistory[powerHistory.length-1].t;
  const tRange = Math.max(tMax - tMin, 1);
  for (let i = 0; i < powerHistory.length; i++) {
    const x = pad.l + ((powerHistory[i].t - tMin) / tRange) * gw;
    const y = pad.t + gh - (powerHistory[i].watts / maxW) * gh;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function drawHostMemGraph() {
  const canvas = document.getElementById('graph-hostmem');
  if (!canvas || hostMemHistory.length < 2) return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.parentElement.clientWidth || 800;
  const W = canvas.width, H = canvas.height;
  const pad = {l:50, r:10, t:20, b:20};
  const gw = W - pad.l - pad.r, gh = H - pad.t - pad.b;
  const yMax = hostMemTotal;

  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = '#21262d';
  ctx.fillStyle = '#8b949e';
  ctx.font = '11px monospace';
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + gh - (i / 4) * gh;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    const val = yMax * i / 4;
    const label = val >= 1024 ? (val / 1024).toFixed(0) + 'G' : val.toFixed(0) + 'M';
    ctx.fillText(label, 2, y + 4);
  }
  ctx.fillText('Host Memory Usage', pad.l, 14);

  ctx.strokeStyle = '#bc8cff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const tMin = hostMemHistory[0].t, tMax = hostMemHistory[hostMemHistory.length-1].t;
  const tRange = Math.max(tMax - tMin, 1);
  for (let i = 0; i < hostMemHistory.length; i++) {
    const x = pad.l + ((hostMemHistory[i].t - tMin) / tRange) * gw;
    const y = pad.t + gh - (hostMemHistory[i].used / yMax) * gh;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

let backendRSSHistory = {};
const RSS_HISTORY_MAX = 300; // 5 min at 1s intervals

initMetrics();

// --- Activity Feed ---
const activityLog = document.getElementById('activity-log');
const ACT_COLORS = {backend: '#3fb950', request: '#58a6ff', system: '#d29922'};
const MAX_ACTIVITY_LINES = 100;

function appendActivity(ev) {
  const line = document.createElement('div');
  line.style.padding = '2px 0';
  line.style.borderBottom = '1px solid #21262d';
  const time = new Date(ev.t * 1000).toLocaleTimeString();
  const color = ACT_COLORS[ev.type] || '#8b949e';
  const taskTag = ev.task_id ? `<span style="color:#bc8cff">[${escapeHtml(ev.task_id)}]</span> ` : '';
  line.innerHTML = `<span style="color:#484f58">${time}</span> <span style="color:${color}">[${ev.type}]</span> ${taskTag}${escapeHtml(ev.message)}`;
  activityLog.insertBefore(line, activityLog.firstChild);
  while (activityLog.children.length > MAX_ACTIVITY_LINES) activityLog.removeChild(activityLog.lastChild);
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Streams replay their ring when they open, so the same event can arrive twice
// — once live before a disconnect, once replayed after it. Held deeper than the
// visible log so a full replay cannot re-admit a line the log already evicted.
const seenActivity = new Set();
const seenActivityOrder = [];
const MAX_SEEN_ACTIVITY = 600;

function activitySeen(ev) {
  const key = (ev.rid || 0) + '#' + (ev.t || 0) + '#' + (ev.message || '');
  if (seenActivity.has(key)) return true;
  seenActivity.add(key);
  seenActivityOrder.push(key);
  if (seenActivityOrder.length > MAX_SEEN_ACTIVITY) seenActivity.delete(seenActivityOrder.shift());
  return false;
}

function initActivity() {
  // No separate /v1/activity prefetch: the stream replays its ring on open,
  // which is the same events. Fetching as well showed every line twice and
  // left a duplicate DOM node per in-flight request.
  const es = new EventSource('/v1/activity/stream');

  // A reconnect rebuilds the in-flight set rather than carrying it across.
  // In-flight is reconstructed from start/done pairs, so anything that finished
  // while the connection was down leaves a start with no done — a timer that
  // counts up in red forever, which is what a slept laptop produces. The
  // replay re-adds whatever is genuinely still running.
  es.onopen = () => {
    for (const [, req] of inflightRequests) {
      if (req.el && req.el.parentNode) req.el.remove();
    }
    inflightRequests.clear();
    inflightSection.style.display = 'none';
  };

  es.onmessage = (e) => {
    try {
      const ev = JSON.parse(e.data);
      handleInflightEvent(ev);
      if (!activitySeen(ev)) appendActivity(ev);
    } catch (err) { /* skip */ }
  };
}

// --- In-Flight Request Timers ---
const inflightSection = document.getElementById('inflight-section');
const inflightList = document.getElementById('inflight-list');
const inflightRequests = new Map(); // key -> {gpu, model, startTime, el}

// Started here rather than at its definition: the stream handlers close over
// the in-flight state declared just above.
initActivity();

function inflightColor(seconds) {
  if (seconds < 5) return '#3fb950';   // green: fast
  if (seconds < 15) return '#58a6ff';  // blue: normal
  if (seconds < 30) return '#d29922';  // yellow: slow
  if (seconds < 60) return '#db6d28';  // orange: very slow
  return '#f85149';                     // red: stuck
}

function handleInflightEvent(ev) {
  if (ev.type !== 'request' || !ev.rid) return;
  const msg = ev.message;
  const key = ev.rid;

  // Request done or aborted — remove timer
  if (msg.includes(' done (') || msg.includes(' aborted ')) {
    if (inflightRequests.has(key)) {
      const req = inflightRequests.get(key);
      if (req.el && req.el.parentNode) req.el.remove();
      inflightRequests.delete(key);
    }
    if (inflightRequests.size === 0) inflightSection.style.display = 'none';
    return;
  }

  // New request — add timer
  const el = document.createElement('div');
  el.style.padding = '3px 0';
  el.style.borderBottom = '1px solid #21262d';
  inflightRequests.set(key, {startTime: ev.t * 1000, el, label: msg, taskID: ev.task_id || ''});
  inflightList.appendChild(el);
  inflightSection.style.display = '';
}

function updateInflightTimers() {
  const now = Date.now();
  for (const [key, req] of inflightRequests) {
    const secs = ((now - req.startTime) / 1000);
    const display = secs < 60 ? secs.toFixed(1) + 's' : Math.floor(secs / 60) + 'm' + Math.floor(secs % 60) + 's';
    const color = inflightColor(secs);
    const gpuMatch = req.label.match(/gpu-(\d+)/);
    const gpuColor = gpuMatch ? GPU_COLORS[parseInt(gpuMatch[1]) % GPU_COLORS.length] : '#8b949e';
    const parts = req.label.split(' → ');
    const model = parts[0] || '';
    const target = parts[1] || '';
    const targetHtml = gpuMatch
      ? `<span style="color:${gpuColor}">${escapeHtml(target)}</span>`
      : escapeHtml(target);
    const taskTag = req.taskID ? `<span style="color:#bc8cff">[${escapeHtml(req.taskID)}]</span> ` : '';
    req.el.innerHTML = `<span style="color:${color};font-weight:bold;min-width:50px;display:inline-block">${display}</span> ${taskTag}${escapeHtml(model)} \u2192 ${targetHtml}`;
  }
  requestAnimationFrame(updateInflightTimers);
}

// In-flight tracking is driven from the stream handler, not from a wrapper
// around appendActivity. It has to see every event including replayed ones,
// while the visible log deduplicates them — funnelling both through one
// function would either skip the rebuild or double-add its DOM node.

requestAnimationFrame(updateInflightTimers);

// Sync activity log height to right column
function syncActivityHeight() {
  const twoCol = document.querySelector('.two-col');
  const leftCol = twoCol?.children[0];
  const rightCol = twoCol?.children[1];
  const log = document.getElementById('activity-log');
  if (!rightCol || !leftCol || !log) return;
  log.style.maxHeight = 'none';
  const rightH = rightCol.offsetHeight;
  const leftOther = leftCol.offsetHeight - log.offsetHeight;
  const available = rightH - leftOther;
  if (available > 200) log.style.maxHeight = available + 'px';
}
new ResizeObserver(syncActivityHeight).observe(document.querySelector('.two-col'));
</script>
</body>
</html>
