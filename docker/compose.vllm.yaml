# viiwork 2 on vLLM: one node per machine, every vLLM model on it.
#
# Copy beside the machine's viiwork.yaml and start it with
#   docker compose -f compose.vllm.yaml up -d
# Reload the model list after editing viiwork.yaml:
#   docker kill -s HUP viiwork

services:
  viiwork:
    image: viiwork-vllm:latest
    container_name: viiwork
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.vllm
      args:
        VERSION: dev
        # The inference stack is whatever this tag carries. Pin it: an
        # unpinned rebuild can change torch, CUDA and the kernels under you.
        VLLM_VERSION: v0.11.2

    # Gossip binds the machine's tailnet (or LAN) address on 7946 and the API
    # listens on 8086. Members dial each other's real addresses, which a
    # bridged container does not have.
    network_mode: host

    # vLLM's inter-process channels, and required for tensor parallelism: the
    # shards talk over shared memory. Without it a multi-card backend hangs at
    # load rather than failing.
    ipc: host

    # The on-GPU check matches backend processes against the host PIDs that
    # nvidia-smi reports.
    pid: host

    # GPU access, which also injects nvidia-smi and libcuda from the host —
    # they are deliberately not in the image, so that they always match the
    # running driver. Two ways to grant it:
    #
    #   driver: cdi   (below) needs nvidia-container-toolkit and a generated
    #                 /etc/cdi/nvidia.yaml, and no Docker daemon restart:
    #                   sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    #
    #   driver: nvidia + count: all
    #                 needs `nvidia-ctk runtime configure --runtime=docker`,
    #                 which DOES restart the daemon and so bounces every other
    #                 container on the machine.
    #
    # Give a single node a subset of the machine's cards by naming them:
    #   device_ids: ["nvidia.com/gpu=0", "nvidia.com/gpu=1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              capabilities: [gpu]
              device_ids: ["nvidia.com/gpu=all"]

    volumes:
      - /models:/models:ro
      - ./viiwork.yaml:/etc/viiwork/viiwork.yaml:ro
      # node.state_dir. The alias table lives here and must survive recreating
      # the container. A host directory rather than a named volume, which any
      # `docker volume prune` deletes while the node is stopped.
      - /var/lib/viiwork:/var/lib/viiwork
      # Model cache, for the HF-repo-id form of models[].path.
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      # On a tailnet the node learns its address and finds other machines
      # through tailscaled's local API. The directory, not the socket file: a
      # mounted file keeps its old inode when tailscaled restarts.
      - /var/run/tailscale:/var/run/tailscale:ro

    environment:
      # Only needed for gated or private models.
      - HF_TOKEN=${HF_TOKEN:-}

    # A secured mesh's secret: VIIWORK_MESH_SECRET=<base64 of exactly 32 bytes>,
    # the same on every machine, in a file readable by root and the operators'
    # group (mode 0640). An open mesh has no such file and sets mesh.open: true
    # in viiwork.yaml instead.
    env_file:
      - path: /etc/viiwork/mesh.env
        required: false

    # A clean stop leaves the mesh, lets in-flight requests finish for
    # health.respawn_grace (60 s by default) and stops the backends (up to
    # 10 s): about 75 s. Docker's default of 10 s would kill the node mid-drain.
    stop_grace_period: 90s

    healthcheck:
      # The node's /health reports 503 until a backend is actually serving, not
      # merely listening, which is what makes this meaningful during vLLM's
      # multi-minute startup.
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/health"]
      interval: 30s
      timeout: 5s
      # vLLM profiles the model, allocates the KV cache and captures CUDA
      # graphs before answering anything. Keep this at or above the model's
      # startup_timeout (the engine default is 20m).
      start_period: 20m
      retries: 3
